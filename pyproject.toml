[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tgagent"
dynamic = ["version"]
description = "An autonomous AI agent that operates a real Telegram user account over MTProto."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tgagent contributors" }]
keywords = ["telegram", "mtproto", "agent", "llm", "telethon", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]

dependencies = [
  # Telegram MTProto (see docs/decisions/0001-telegram-library.md)
  "telethon>=1.44,<2",
  # Configuration / validation
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  # Structured logging
  "structlog>=24.1",
  # CLI
  "typer>=0.12",
  "rich>=13.7",
  # Persistence
  "aiosqlite>=0.20",
  # Scheduling
  "croniter>=2.0",
  # zoneinfo reads the *system* tz database, which Windows lacks entirely and
  # slim Linux images frequently omit. Bundling it makes cron schedules with a
  # timezone work identically everywhere.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
# Rust-accelerated MTProto crypto; large speedup on media transfer.
speedups = ["cryptg>=0.4"]
# SOCKS/HTTP proxy support for the MTProto connection.
proxy = ["PySocks>=1.7"]
all = ["tgagent[anthropic,openai,speedups,proxy]"]
dev = [
  "tgagent[anthropic,openai,proxy]",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-croniter",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/tgagent/tgagent"
Documentation = "https://github.com/tgagent/tgagent/tree/main/docs"
Source = "https://github.com/tgagent/tgagent"
Issues = "https://github.com/tgagent/tgagent/issues"

[project.scripts]
tgagent = "tgagent.interfaces.cli:main"

[tool.hatch.version]
path = "src/tgagent/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tgagent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE"]

# ---------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # flake8-bugbear
  "UP",        # pyupgrade
  "C4",        # comprehensions
  "SIM",       # simplify
  "ASYNC",     # async correctness
  "S",         # bandit-style security
  "BLE",       # no bare/blind except without justification
  "SLF",       # no reaching into another object's privates
  "PERF",      # obvious performance mistakes
  "RUF",       # ruff-specific
  "TID",       # tidy imports
  "PTH",       # prefer pathlib
  "T20",       # no print()
]
ignore = [
  "E501",    # line length handled by the formatter
  "S101",    # assert is fine in tests (per-file ignore keeps prod clean via S rules)
  "SIM108",  # ternary is not always clearer
  "B008",    # typer uses function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to reach into internals: asserting on the state a unit
# actually keeps is often the only way to pin a behaviour that has no public
# read-back, and a test that can only see the public surface is a test that
# cannot catch a regression in the private one.
"tests/**" = ["S", "T20", "PTH", "ASYNC", "SLF"]
"src/tgagent/interfaces/cli.py" = ["T20"]
"src/tgagent/sandbox/worker.py" = ["T20"]  # the worker speaks JSON-lines on stdout

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy ----
[tool.mypy]
python_version = "3.11"
files = ["src/tgagent"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = [
  "telethon.*", "croniter.*", "aiosqlite.*",
  "anthropic.*", "openai.*", "socks.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# -------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: exercises several subsystems together (still fully offline)",
  "slow: takes more than a second",
]
filterwarnings = ["error::DeprecationWarning:tgagent.*"]

[tool.coverage.run]
source = ["src/tgagent"]
branch = true
omit = ["src/tgagent/__about__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

# -------------------------------------------------------------- bandit ----
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# Ruff's `S` ruleset (selected above) implements every check listed here and runs
# on every file, where suppressing one costs a per-site `# noqa` with a written
# justification. Bandit is kept as a second opinion for the rules ruff does *not*
# implement; annotating the overlap twice would only mean two comments to forget
# to remove. Each skip below is a pattern this codebase uses deliberately:
skips = [
  "B101", # assert — invariants the type checker cannot express, never validation
  "B102", # exec  — the sandbox worker runs agent code by design
  "B108", # /tmp  — paths inside the container's tmpfs, not on the host
  "B112", # try/except/continue — best-effort introspection of TL objects
  "B307", # eval  — the sandbox worker, as above
  "B311", # random — retry jitter, not cryptography
  "B608", # SQL built from a class constant column list, never from input
]
